services:
  - type: web
    name: snuc-orientation
    runtime: node
    rootDir: server
    buildCommand: npm install && cd ../frontend && npm install && npm run build
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
