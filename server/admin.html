<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/images/snuc_logo.jpeg" type="image/jpeg">
  <title>SNUC Admin Dashboard</title>
  <style>
    body{font-family:Arial;padding:30px;background:#f5f5f5}
    table{border-collapse:collapse;width:100%;background:white;margin-top:10px}
    th,td{border:1px solid #ddd;padding:10px;text-align:center}
    th{background:#007bff;color:white}
    h2{margin-bottom:5px}
    .summary{color:#555;margin-bottom:20px}
    .user-header{background:#e8f0fe;font-weight:bold}
    #exportBtn{background:#28a745;color:white;border:none;padding:10px 18px;border-radius:5px;font-size:14px;cursor:pointer}
    #exportBtn:hover{background:#218838}
  </style>
</head>
<body>
  <h2>SNUC Orientation Results</h2>
  <div class="summary" id="summary"></div>
  <button id="exportBtn" onclick="exportResults()">Export as CSV</button>
  <br><br>
  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>Modules Completed</th>
        <th>Module</th>
        <th>Retries</th>
        <th>Date Completed</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

<script>
let resultsData = [];

fetch("/api/results")
  .then(r => r.json())
  .then(data => {
    resultsData = data;
    const grouped = {};
    data.forEach(r => {
      if (!grouped[r.email]) grouped[r.email] = [];
      grouped[r.email].push(r);
    });

    const tbody = document.getElementById("tableBody");
    const total = Object.keys(grouped).length;
    document.getElementById("summary").textContent = `Total users: ${total}`;

    Object.entries(grouped).forEach(([email, modules]) => {
      modules.forEach((m, i) => {
        const row = tbody.insertRow();
        if (i === 0) {
          const emailCell = row.insertCell();
          emailCell.textContent = email;
          emailCell.rowSpan = modules.length;
          const countCell = row.insertCell();
          countCell.textContent = `${modules.length}/4`;
          countCell.rowSpan = modules.length;
        }
        row.insertCell().textContent = m.moduleId;
        row.insertCell().textContent = m.retries;
        row.insertCell().textContent = m.date;
      });
    });
  });

function exportResults() {
  const header = "Email,Module,Retries,Score,Date";
  const rows = resultsData.map(r =>
    [r.email, r.moduleId, r.retries, r.score, r.date].join(",")
  );
  const csv = [header, ...rows].join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `snuc-results-${new Date().toISOString().split("T")[0]}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
